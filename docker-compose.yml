services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - CIFRACLUB_API_URL=${CIFRACLUB_API_URL:-http://cifraclub-api:3000}
      - DB_HOST=${DB_HOST:-db}
      - DB_USER=${DB_USER:-root}
      - DB_PASS=${DB_PASS:-rootpassword}
      - DB_NAME=${DB_NAME:-benapp}
      - DB_PORT=${DB_PORT:-5432}
    depends_on:
      - db
      - cifraclub-api

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASS:-rootpassword}
      POSTGRES_DB: ${DB_NAME:-benapp}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  cifraclub-api:
    build: ./Services/cifraclub-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
