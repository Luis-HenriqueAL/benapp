services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - CIFRACLUB_API_URL=http://cifraclub-api:3000
    depends_on:
      - db
      - cifraclub-api

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: benapp
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  cifraclub-api:
    build: ./services/cifraclub-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
